[project]
name = "down-vedio"
version = "0.1.0"
description = "Video parse/download + AI SaaS"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.0",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "structlog>=24.1",
  "sentry-sdk[fastapi,celery]>=2.0",
  "yt-dlp==2024.8.6",
  "faster-whisper>=1.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  # mypy 2.x subtree (ast-serialize) has no cp312 wheels yet; stay on 1.x for local typecheck
  "mypy>=1.10,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008: Depends() in defaults is the standard FastAPI idiom
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
