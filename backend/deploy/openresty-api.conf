# Stream uploads to the API; do not create an unaccounted proxy body copy.
# The API additionally enforces each account's limit (free 256 MiB / member 512 MiB).
location /api/v1/uploads/ {
    client_max_body_size 512m;
    client_body_timeout 30s;
    error_page 413 = @upload_size_error;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 610s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
}
location @upload_size_error {
    default_type application/json;
    return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"文件超过上传体积上限","request_id":"req_$request_id"}}';
}

# Paste inside the 1Panel website's server block. OpenResty network mode: host.
location /api/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
}
# Public documents are generated as real HTML files. Unknown URLs keep a 404.
# Set the site's root to the release frontend/dist directory.
location = /index.html { return 301 /; }
location ~ ^/(help|privacy|examples|examples/knowledge-loop|subscription)/index\.html$ {
    return 301 /$1;
}
location = / {
    try_files /index.html =404;
}
location = /subscription {
    try_files /subscription/index.html =404;
}
location ~ ^/(app|account|library|settings)/?$ {
    add_header X-Robots-Tag "noindex, follow" always;
    try_files /app-shell.html =404;
}
location ~ ^/(video/[^/]+|admin(?:/.*)?)/?$ {
    add_header X-Robots-Tag "noindex, follow" always;
    try_files /app-shell.html =404;
}
location = /app-shell.html {
    add_header X-Robots-Tag "noindex, follow" always;
}
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, follow" always;
}
error_page 404 /404.html;
location / {
    try_files $uri $uri/index.html =404;
}
