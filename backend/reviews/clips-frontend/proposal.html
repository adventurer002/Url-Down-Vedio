'use strict';
const candidates=[{id:'a',title:'先确定内容价值，再决定切在哪里',start:'02:12',end:'03:05',reason:'观点完整，适合独立观看',quote:'做内容切片，第一步不是把视频切短。我们要先看这一段能不能独立讲清楚一个观点，观众在不了解前文的情况下，是否仍然能获得完整的信息。如果答案是肯定的，这一段才值得被留下来。'},{id:'b',title:'给每一段保留必要的上下文',start:'07:36',end:'08:18',reason:'有具体方法，能够直接应用',quote:'有些片段单看一句话很有吸引力，但省掉前面的条件，含义就变了。保留必要的上下文，比多剪出几条视频更重要。我们希望观众看完之后理解的是同一个意思，而不是一段缺少依据的结论。'},{id:'c',title:'从重复发布转向整理可复用的成果',start:'12:08',end:'13:02',reason:'补充不同主题，减少重复内容',quote:'真正能提高效率的，是让每次整理都留下可复用的成果。下一次需要这段内容时，可以直接找到完整观点和对应的视频，而不是从头再听一遍。'}];
const params=new URLSearchParams(location.search);let view=params.get('view')||'candidates';let active=0;let scenario=params.get('source')||'video';let selected=new Set(params.get('selected')==='2'?['a','b']:[]);document.querySelector('#scenario').value=scenario;
const $=s=>document.querySelector(s);const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function announce(text){$('#message').textContent=text}function setView(next){view=next;$('#message').textContent='';render();requestAnimationFrame(updateSticky)}function toggleCandidate(id,checked){checked?selected.add(id):selected.delete(id);render();updateSticky();document.getElementById('pick-'+id)?.focus()}function showDetail(index){active=index;if(innerWidth<1024){openDialog(candidates[index].title,`<p>${escape(candidates[index].quote)}</p><p class="subtle">约 ${candidates[index].start}–${candidates[index].end}，生成时再精确定位。</p>`,false)}else render()}

function quoteExport(){if(!selected.size)return;openDialog('确认生成 '+selected.size+' 段视频',`<p>MP4，最高 720p，保留原比例。生成时会精确定位起止时间。</p><div class="note">本次不消耗转写和 AI 次数，仍受每日处理次数及下载流量限制。实际开始处理后，失败或取消也可能占用处理次数。</div><p>文件保留时间以每条成品显示的到期时间为准。此次为原型，不发起任务。</p>`,true,()=>setView('generating'))}
function detail(){const c=candidates[active];return `<aside class="detail"><div class="label">片段原文</div><h3>${c.title}</h3><blockquote>${c.quote}</blockquote><hr><div class="label">为什么入选</div><p class="reason">${c.reason}。保留必要上下文，减少对前文的依赖。</p><hr><p>约 ${c.start}–${c.end}，尚未精确定位。</p><p>当前原片预览不可用，可先审阅原文。生成后逐条下载查看。</p></aside>`}
function updateSticky(){const list=$('.list'),bar=$('.selection');if(list&&bar)bar.classList.toggle('is-sticky',list.getBoundingClientRect().top<innerHeight-bar.offsetHeight-180)}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));const audio=scenario==='audio';$('#kind').textContent=audio?'本地音频':'本地视频';$('#retention').textContent=scenario==='missing'?'原文件已删除':'原文件保留至 11/3 18:30';$('#heading-action').hidden=['settings','generating','empty'].includes(view);$('#section-title').textContent=view==='results'?'已生成的视频片段':'精彩切片';$('#section-description').textContent=audio?'从音频中寻找精彩段落；视频导出需要视频原文件。':view==='results'?'按片段下载，文件保留时间分别计算。':'先挑选完整观点，再生成可下载的视频片段。';const note=$('#source-note');note.hidden=scenario==='video';note.innerHTML=audio?'音频支持分析与复制原文，当前内容不能导出视频。': '原片已删除。已有成品仍可下载；选择候选后，系统会检查是否能复用已有视频。';
if(view==='settings'){$('#view').innerHTML=`<div class="config"><p class="configintro">从已有文稿寻找可以独立表达的精彩内容。先查看本次额度，确认后再开始分析。</p><div class="field"><label for="count">希望找到几段</label><select id="count"><option>3 段</option><option>1 段</option><option>2 段</option><option>4 段</option><option>5 段</option></select><small>实际数量以内容完整性为准，可能少于设置值。</small></div><div class="field"><label>每段目标时长</label><div class="range"><input aria-label="最小时长，秒" type="number" value="30" min="1" max="90"><span>至</span><input aria-label="最大时长，秒" type="number" value="90" min="1" max="90"><span>秒</span></div><small>最终起止时间在生成视频时精确定位。</small></div><div class="field"><label for="focus">重点关注什么（可选）</label><textarea id="focus" maxlength="200" placeholder="例如：观点鲜明、带具体方法，适合不了解前文的人观看"></textarea><small>最多 200 字</small></div><div class="configfooter"><p>使用已有文稿，不重复转写。</p><button class="primary" onclick="openDialog('确认本次分析额度','<p>示例：最多占用转写额度 0 秒，AI 额度 1 次。没有符合条件的片段时，不扣本次 AI 额度。</p><p>确认后可关闭页面，稍后从任务历史继续。</p>',true,()=>setView('candidates'))">查看分析额度</button></div></div>`;return}
if(view==='empty'){$('#view').innerHTML=`<div class="empty"><h3>没有找到符合当前条件的片段</h3><p>内容可能需要更多上下文，或与当前时长和主题要求不匹配。本次没有生成候选视频。</p><div class="note">示例：本次分析未扣 AI 额度。正式界面以后端任务及结算记录为准。</div><button class="primary" onclick="setView('settings')">调整查找条件</button> <button class="link" onclick="announce('示意：定位到当前方案绑定的文稿')">查看原文</button></div>`;return}
if(audio&&['generating','results'].includes(view)){$('#view').innerHTML='<div class="empty"><h3>当前内容为音频</h3><p>可以在候选中查看和复制精彩段落，视频生成需要真实的视频原文件。</p><button class="primary" onclick="setView(\'candidates\')">查看精彩段落</button></div>';return}

if(view==='results'){$('#view').innerHTML=`<div class="settingsrow"><span>共 2 段　·　MP4　·　保留原比例</span><button class="link" onclick="setView('candidates')">返回候选</button></div><div class="exports">${candidates.slice(0,2).map((c,i)=>`<article class="export"><div class="file"><span class="fileicon">MP4</span><div><h3>${c.title}</h3><span class="subtle" style="font-size:13px">${i?'00:42':'00:53'}　·　${i?'7.8':'9.6'} MB</span></div></div><p>源视频 ${c.start}–${c.end}（已定位）</p><p>${i?'保留至 11/3 18:42':'复用已有视频，保留至 11/3 17:10'}</p><button class="primary" onclick="announce('原型示意：正式下载时为这一个文件获取短期访问凭证')">下载视频</button></article>`).join('')}</div><div class="note">每条视频使用各自的保留时间。页面刷新和重复获取不会延长已生成文件的有效期。</div>`;return}
$('#view').innerHTML=`<div class="settingsrow"><span>找到 3 段候选　·　目标时长 30–90 秒</span><span>候选时间仅供参考，生成时精确定位</span></div><div class="layout"><div class="list">${candidates.map((c,i)=>`<article class="candidate ${selected.has(c.id)&&!audio?'selected':''} ${active===i?'active':''}"><div class="rowtitle">${audio?'':`<label class="pick"><input type="checkbox" id="pick-${c.id}" aria-label="选择：${c.title}" ${selected.has(c.id)?'checked':''} onchange="toggleCandidate('${c.id}',this.checked)"></label>`}<div class="rowcopy"><h3>${c.title}</h3><div class="time">约 ${c.start}–${c.end}<span class="pending">待定位</span></div></div></div><p class="excerpt">${c.quote}</p><div class="cardbottom"><span>${c.reason}</span><button class="link" onclick="showDetail(${i})">查看原文</button></div></article>`).join('')}</div>${detail()}</div><div class="selection"><div><strong>${audio?'可查看、复制精彩段落':`已选择 ${selected.size} 段`}</strong><p>${audio?'当前内容为音频，不能生成视频':'MP4，最高 720p，保留原比例；最终时长待精细定位'}</p></div><button class="primary" ${audio||!selected.size?'disabled':''} onclick="quoteExport()">${audio?'当前内容无法导出视频':'查看生成说明'}</button></div>`}
