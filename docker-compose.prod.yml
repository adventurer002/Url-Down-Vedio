"""Production compose: no dev mounts, no flower, restart always, resource caps."""

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: downvedio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: always

  backend:
    build: .
    command: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/downvedio
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    restart: always

  worker-download:
    build: .
    command: uv run --no-sync celery -A backend.app.worker.celery_app.celery_app worker -Q default,download -l info --concurrency 4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/downvedio
      REDIS_URL: redis://redis:6379/0
    volumes:
      - mediadata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    restart: always

  worker-ai:
    build: .
    command: uv run --no-sync celery -A backend.app.worker.celery_app.celery_app worker -Q ai -l info --concurrency 1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/downvedio
      REDIS_URL: redis://redis:6379/0
    volumes:
      - mediadata:/app/data
      - hfcache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    restart: always

  beat:
    build: .
    command: uv run --no-sync celery -A backend.app.worker.celery_app.celery_app beat -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  redisdata:
  mediadata:
  hfcache:
