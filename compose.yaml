name: videohub_ai

# API, Solo Worker and Vite run natively via ./scripts/dev.sh --docker.
# Keep Docker limited to PG/Redis on an M1 with 8GB RAM.
x-logging: &local-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  postgres:
    image: postgres:16-alpine
    logging: *local-logging
    stop_grace_period: 20s
    environment:
      POSTGRES_USER: videohub_user
      POSTGRES_PASSWORD: videohub_pass
      POSTGRES_DB: videohub_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videohub_user -d videohub_dev"]
      interval: 5s
      timeout: 2s
      retries: 10
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    logging: *local-logging
    stop_grace_period: 10s
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    mem_limit: 256m
volumes:
  postgres_data:
  redis_data:
